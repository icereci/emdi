<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>emdi — markdown editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Markdown parser + syntax highlighter for code fences -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* Theme tokens — applied via data-theme on .emdi-root */
    .emdi-root {
      /* Default (dark) — overridden below */
      --bg:           #1b1c1f;
      --bg-elev:      #232428;
      --bg-soft:      #1f2024;
      --panel:        #16171a;
      --border:       #2c2e33;
      --border-soft:  #232428;
      --fg:           #e6e6e8;
      --fg-soft:      #a5a7ad;
      --fg-mute:      #6c6e76;
      --accent:       #7aa2ff;
      --accent-soft:  rgba(122,162,255,.14);
      --selection:    rgba(122,162,255,.28);
      --danger:       #f07178;
      --success:      #98c379;
      --warning:      #e5c07b;
      --shadow:       0 8px 28px rgba(0,0,0,.45);
      --code-bg:      #131418;
      --code-fg:      #d4d4d6;
      --hr:           #2a2c31;
      --kbd:          #2c2e33;
      --rule:         #2a2c31;
      color-scheme: dark;
    }

    .emdi-root[data-theme="light"] {
      --bg:           #fbfbf9;
      --bg-elev:      #ffffff;
      --bg-soft:      #f4f4f1;
      --panel:        #ffffff;
      --border:       #e3e2dd;
      --border-soft:  #edece7;
      --fg:           #1c1c1a;
      --fg-soft:      #5b5b58;
      --fg-mute:      #8a8a85;
      --accent:       #3a6df0;
      --accent-soft:  rgba(58,109,240,.10);
      --selection:    rgba(58,109,240,.18);
      --code-bg:      #f3f2ee;
      --code-fg:      #1c1c1a;
      --hr:           #e3e2dd;
      --kbd:          #ebeae5;
      --rule:         #e3e2dd;
      --shadow:       0 8px 28px rgba(20,20,15,.10);
      color-scheme: light;
    }

    /* Accent overrides (set via inline style on root) */

    .emdi-root {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
    }

    /* ─── Top bar ─────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 40px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
      user-select: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--fg);
    }
    .brand-mark {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
    }
    .brand-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      margin-left: 2px;
    }
    .file-tab {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--bg-soft);
      border: 1px solid var(--border-soft);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--fg-soft);
    }
    .file-tab .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--warning);
    }
    .file-tab.saved .dot { background: var(--fg-mute); opacity: .5; }

    .spacer { flex: 1; }

    .seg {
      display: inline-flex;
      background: var(--bg-soft);
      border: 1px solid var(--border-soft);
      border-radius: 7px;
      padding: 2px;
      gap: 2px;
    }
    .seg button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--fg-soft);
      font: inherit;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .seg button:hover { color: var(--fg); }
    .seg button.active {
      background: var(--bg-elev);
      color: var(--fg);
      box-shadow: 0 1px 0 rgba(0,0,0,.04);
    }
    .emdi-root[data-theme="light"] .seg button.active {
      box-shadow: 0 1px 2px rgba(20,20,15,.06);
    }

    .icon-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--fg-soft);
      font: inherit;
      width: 28px; height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
    }
    .icon-btn:hover { background: var(--bg-soft); color: var(--fg); }
    .icon-btn.active { background: var(--accent-soft); color: var(--accent); }

    .vs-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px 3px 6px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 10.5px;
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .01em;
      border: 1px solid color-mix(in oklch, var(--accent) 35%, transparent);
      cursor: pointer;
    }
    .vs-badge .pulse {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 currentColor;
      animation: pulse 2.2s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 color-mix(in oklch, currentColor 60%, transparent); }
      100% { box-shadow: 0 0 0 7px transparent; }
    }

    /* ─── Workspace ─────────────────────────────────────── */
    .workspace {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
      background: var(--bg);
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--bg);
    }

    .pane-head {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 30px;
      padding: 0 10px 0 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border-soft);
      flex: 0 0 auto;
      font-size: 11px;
      color: var(--fg-mute);
      user-select: none;
    }
    .pane-head .label {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: 10px;
      color: var(--fg-mute);
    }
    .pane-head .label .swatch {
      display: inline-block;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      margin-right: 6px;
      vertical-align: middle;
    }

    .zoom-pill {
      display: inline-flex; align-items: center;
      background: var(--bg-soft);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      padding: 1px;
      gap: 0;
      height: 22px;
    }
    .zoom-pill button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--fg-soft);
      font: inherit;
      width: 20px; height: 20px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-grid; place-items: center;
    }
    .zoom-pill button:hover { background: var(--bg-elev); color: var(--fg); }
    .zoom-pill button:disabled { opacity: .35; cursor: not-allowed; }
    .zoom-pill .zoom-val {
      min-width: 44px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--fg);
      padding: 0 4px;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }
    .zoom-pill .zoom-val:hover { color: var(--accent); }

    /* ─── Editor ─────────────────────────────────────── */
    .editor-wrap {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }
    .gutter {
      flex: 0 0 auto;
      padding: 14px 6px 14px 14px;
      text-align: right;
      font-family: var(--mono-font, 'JetBrains Mono'), ui-monospace, monospace;
      color: var(--fg-mute);
      user-select: none;
      overflow: hidden;
      line-height: 1.65;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
      border-right: 1px solid var(--border-soft);
      background: var(--bg);
      min-width: 42px;
    }
    .gutter span { display: block; }
    .gutter span.cur { color: var(--fg-soft); }

    .editor-scroll {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      position: relative;
    }
    .editor-area {
      width: 100%;
      min-height: 100%;
      padding: 14px 18px 32px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: var(--fg);
      font-family: var(--mono-font, 'JetBrains Mono'), ui-monospace, monospace;
      line-height: 1.65;
      letter-spacing: .01em;
      tab-size: 2;
      white-space: pre-wrap;
      word-break: break-word;
      caret-color: var(--accent);
      display: block;
    }
    .editor-area::selection { background: var(--selection); }
    .editor-area::-webkit-scrollbar { width: 10px; height: 10px; }
    .editor-area::-webkit-scrollbar-track { background: transparent; }
    .editor-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

    /* ─── Splitter ─────────────────────────────────────── */
    .splitter {
      flex: 0 0 1px;
      background: var(--border);
      position: relative;
      cursor: col-resize;
      user-select: none;
    }
    .splitter::before {
      content: '';
      position: absolute;
      inset: 0 -3px;
    }
    .splitter::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 2px; height: 28px;
      border-radius: 2px;
      background: var(--fg-mute);
      opacity: 0;
      transition: opacity .15s;
    }
    .splitter:hover::after, .splitter.dragging::after { opacity: .5; }
    .splitter.dragging { background: var(--accent); }

    /* ─── Preview ─────────────────────────────────────── */
    .preview-scroll {
      flex: 1;
      overflow: auto;
      min-height: 0;
      min-width: 0;
      background: var(--bg);
    }
    .preview-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
    .preview-scroll::-webkit-scrollbar-track { background: transparent; }
    .preview-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

    .md-body {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 40px 80px;
      color: var(--fg);
      font-family: var(--prose-font, 'Inter'), ui-sans-serif, system-ui, sans-serif;
      line-height: 1.7;
      font-size: 15px;
    }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 {
      font-family: var(--prose-heading-font, var(--prose-font, 'Inter')), ui-sans-serif, system-ui, sans-serif;
      font-weight: 700;
      line-height: 1.25;
      margin: 1.6em 0 0.6em;
      letter-spacing: -0.015em;
      color: var(--fg);
    }
    .md-body h1 { font-size: 1.95em; border-bottom: 1px solid var(--rule); padding-bottom: 0.3em; margin-top: 0.3em; }
    .md-body h2 { font-size: 1.5em; border-bottom: 1px solid var(--rule); padding-bottom: 0.25em; }
    .md-body h3 { font-size: 1.2em; }
    .md-body h4 { font-size: 1.05em; }
    .md-body h5 { font-size: 0.95em; color: var(--fg-soft); }
    .md-body h6 { font-size: 0.85em; color: var(--fg-mute); text-transform: uppercase; letter-spacing: 0.05em; }
    .md-body p { margin: 0.7em 0; }
    .md-body a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in oklch, var(--accent) 40%, transparent); }
    .md-body a:hover { border-bottom-color: var(--accent); }
    .md-body strong { font-weight: 700; color: var(--fg); }
    .md-body em { font-style: italic; }
    .md-body del { color: var(--fg-mute); }
    .md-body ul, .md-body ol { padding-left: 1.6em; margin: 0.7em 0; }
    .md-body li { margin: 0.25em 0; }
    .md-body li > p { margin: 0.3em 0; }
    .md-body ul li::marker { color: var(--accent); }
    .md-body ol li::marker { color: var(--fg-mute); font-variant-numeric: tabular-nums; }
    .md-body blockquote {
      margin: 1em 0;
      padding: 0.4em 1em;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      color: var(--fg-soft);
      border-radius: 0 6px 6px 0;
    }
    .md-body blockquote p { margin: 0.4em 0; }
    .md-body hr {
      border: 0;
      border-top: 1px solid var(--hr);
      margin: 2em 0;
    }
    .md-body code {
      font-family: var(--mono-font, 'JetBrains Mono'), ui-monospace, monospace;
      font-size: 0.88em;
      background: var(--code-bg);
      color: var(--code-fg);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      border: 1px solid var(--border-soft);
    }
    .md-body pre {
      background: var(--code-bg);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      line-height: 1.55;
      margin: 1em 0;
      position: relative;
    }
    .md-body pre code {
      background: transparent;
      border: 0;
      padding: 0;
      font-size: 0.85em;
      color: var(--code-fg);
    }
    .md-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      font-size: 0.95em;
    }
    .md-body th, .md-body td {
      border: 1px solid var(--rule);
      padding: 0.5em 0.8em;
      text-align: left;
    }
    .md-body th { background: var(--bg-soft); font-weight: 600; }
    .md-body tbody tr:nth-child(even) td { background: color-mix(in oklch, var(--bg-soft) 50%, transparent); }
    .md-body img { max-width: 100%; border-radius: 6px; }
    .md-body kbd {
      font-family: var(--mono-font, 'JetBrains Mono'), monospace;
      font-size: 0.82em;
      padding: 1px 6px;
      background: var(--kbd);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 4px;
      color: var(--fg);
    }
    .md-body input[type="checkbox"] {
      margin-right: 0.4em;
      accent-color: var(--accent);
    }
    .md-body .task-list-item { list-style: none; margin-left: -1.4em; }

    /* highlight.js theme (minimal, theme-aware) */
    .hljs-comment, .hljs-quote { color: var(--fg-mute); font-style: italic; }
    .hljs-keyword, .hljs-selector-tag, .hljs-built_in { color: color-mix(in oklch, var(--accent) 80%, var(--fg) 20%); }
    .hljs-string, .hljs-doctag { color: #98c379; }
    .emdi-root[data-theme="light"] .hljs-string, .emdi-root[data-theme="light"] .hljs-doctag { color: #4a8a3a; }
    .hljs-number, .hljs-literal { color: #d19a66; }
    .emdi-root[data-theme="light"] .hljs-number, .emdi-root[data-theme="light"] .hljs-literal { color: #a06400; }
    .hljs-title, .hljs-section, .hljs-name, .hljs-attr { color: #e5c07b; }
    .emdi-root[data-theme="light"] .hljs-title, .emdi-root[data-theme="light"] .hljs-section, .emdi-root[data-theme="light"] .hljs-name, .emdi-root[data-theme="light"] .hljs-attr { color: #b27200; }
    .hljs-variable, .hljs-template-variable, .hljs-attribute { color: #e06c75; }
    .emdi-root[data-theme="light"] .hljs-variable, .emdi-root[data-theme="light"] .hljs-template-variable, .emdi-root[data-theme="light"] .hljs-attribute { color: #b03540; }
    .hljs-meta, .hljs-symbol { color: var(--fg-mute); }
    .hljs-tag { color: var(--fg-soft); }

    /* ─── Status bar ─────────────────────────────────────── */
    .statusbar {
      flex: 0 0 auto;
      height: 24px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      letter-spacing: .02em;
      user-select: none;
    }
    .statusbar .sb-grow { flex: 1; }
    .statusbar .sb-item { display: inline-flex; align-items: center; gap: 5px; opacity: .92; }
    .statusbar .sb-item:hover { opacity: 1; cursor: pointer; }
    .statusbar .sb-sep { width: 1px; height: 12px; background: rgba(255,255,255,.25); }

    /* ─── Single pane modes ─────────────────────────────────────── */
    .workspace.single .pane { flex: 1 !important; }
    .workspace.single .splitter { display: none; }

    /* ─── Toast for zoom keyboard hints ─────────────────────────────────────── */
    .zoom-toast {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--fg);
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      z-index: 10;
    }
    .zoom-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(2px);
    }
    .zoom-toast .key {
      color: var(--accent);
      margin: 0 2px;
      font-weight: 600;
    }

    /* ─── VS Code sync popover ─────────────────────────────────────── */
    .vs-popover {
      position: absolute;
      top: 44px; right: 12px;
      width: 280px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 14px;
      font-size: 11.5px;
      z-index: 20;
    }
    .vs-popover h4 {
      margin: 0 0 8px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--fg-mute);
      font-weight: 600;
    }
    .vs-popover .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-soft);
    }
    .vs-popover .row:last-child { border-bottom: 0; }
    .vs-popover .row .val {
      font-family: 'JetBrains Mono', monospace;
      color: var(--fg-soft);
      font-size: 10.5px;
    }
    .vs-popover .vs-status {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--success);
      font-weight: 500;
    }
    .vs-popover .vs-status .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--success) 30%, transparent);
    }

    /* simple toggle switch for VS Code popover */
    .switch {
      appearance: none;
      width: 28px; height: 16px;
      border-radius: 999px;
      background: var(--border);
      position: relative;
      cursor: pointer;
      transition: background .15s;
      flex: 0 0 auto;
    }
    .switch:checked { background: var(--accent); }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 12px; height: 12px;
      background: #fff;
      border-radius: 50%;
      transition: left .15s;
    }
    .switch:checked::after { left: 14px; }

    /* When in vertical (stacked) split */
    .workspace.vertical {
      flex-direction: column;
    }
    .workspace.vertical .splitter {
      flex: 0 0 1px;
      cursor: row-resize;
      width: 100%;
      height: 1px;
    }
    .workspace.vertical .splitter::before { inset: -3px 0; }
